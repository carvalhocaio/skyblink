<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SkyBlink end card</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Mona+Sans:wdth,wght@100..125,400..700&display=block">
<link rel="stylesheet" href="card.css">
<style>
  h1 { font-size: 112px; font-weight: 650; font-stretch: 112%; letter-spacing: -0.035em; line-height: 1; }
  h1 span { color: var(--primary); }
  .url {
    display: inline-block; margin-top: 48px; padding: 18px 36px; border-radius: 999px;
    background: var(--primary); color: #05070d; font-size: 40px; font-weight: 600;
  }
  .data { margin-top: 40px; font-size: 22px; color: var(--muted); }
  .ai { position: fixed; left: 0; right: 0; bottom: 210px; text-align: center; font-size: 18px; color: #94a3b8b0; }
</style>
</head>
<body>
<main>
  <h1 class="in">Sky<span>Blink</span></h1>
  <p class="in d1"><span class="url">https://skyblink-swart.vercel.app</span></p>
  <p class="data mono in d2">Real NASA SPHEREx data via IRSA · ESA Gaia</p>
</main>
<p class="ai in d3">Voiceover generated with ElevenLabs (AI)</p>
</body>
</html>
