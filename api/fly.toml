app = "skyblink-api"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  SKYBLINK_CACHE_DIR = "/data/cache"
  SKYBLINK_OUTPUT_DIR = "/data/out"

[mounts]
  source = "skyblink_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
