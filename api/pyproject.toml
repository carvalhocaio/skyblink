[project]
name = "skyblink"
version = "0.1.0"
description = "SPHEREx moving-object frame sequences (NASA Space Apps 2026, Planet X and SPHEREx)"
authors = [
    { name = "Caio Carvalho", email = "caiocarvalho.py@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.2",
    "astroquery>=0.4.11",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "reproject>=0.21.0",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not e2e'"
markers = ["e2e: hits the real IRSA services (run with -m e2e)"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
